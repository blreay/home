services:
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: llm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: qwenmon2026
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
    container_name: llm-dcgm-exporter
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nvidia-gpu-exporter:
    build: ./nvidia-smi-exporter
    image: llm-nvidia-smi-exporter:1.0
    container_name: llm-nvidia-smi-exporter
    restart: unless-stopped
    pid: host
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=utility
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  comfyui-exporter:
    build: ./comfyui-exporter
    image: comfyui-exporter:1.0
    container_name: llm-comfyui-exporter
    restart: unless-stopped
    environment:
      - COMFYUI_URL=http://host.docker.internal:18188
    ports:
      - "9464:9464"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  llama-slots-exporter:
    build: ./llama-slots-exporter
    image: llama-slots-exporter:1.0
    container_name: llm-llama-slots-exporter
    restart: unless-stopped
    environment:
      - LLAMA_URL=http://host.docker.internal:8000
    ports:
      - "9465:9465"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
  grafana-data:
