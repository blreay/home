# 追加到 prometheus.yml 的 scrape_configs 下（与 vllm/dcgm 等 job 平级）
# 假设 LiteLLM 跑在宿主机 4000 端口；跑在容器里就改成 <litellm容器名或IP>:4000
- job_name: 'litellm'
  metrics_path: /metrics
  static_configs:
    - targets: ['host.docker.internal:4000']
      labels:
        service: litellm
  # /metrics 默认要求鉴权：用 master_key 或任意有效 API key
  bearer_token: sk-CHANGE-ME
